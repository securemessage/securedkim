[global]
AuthservID      = mail.freebsd-dev1.morante.com
WorkerThreads   = 1
Foreground      = yes
PidFile         = /tmp/securedkim-test.pid
DnsNameserver   = 127.0.0.1
DnsTimeout      = 5
DnsRetries      = 2

[listener:sign-outbound]
Socket          = inet:8891@127.0.0.1
Mode            = sign
Domain          = bambania.com
Selector        = test2026
KeyFile         = test/keys/bambania.key
